<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Geocaching: Dono</title>
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    .painel { max-width: 1200px; margin: 0 auto; padding-block: 16px 48px; padding-inline: 16px; }
    .painel h1 { text-align: left; margin: 8px 0 4px; font-size: 1.6rem; }
    .linha-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
    .ligacao { font-size: .85rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--suave-fundo); color: var(--suave); }
    .ligacao.ok { background: var(--realce-fundo); color: var(--certo); }
    .ligacao.mal { background: var(--perigo-fundo); color: var(--erro); }
    .separadores { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .separadores button { background: var(--suave-fundo); color: var(--primaria-escura); font-weight: 600; padding: 10px 16px; font-size: .9rem; }
    .separadores button[aria-selected="true"] { background: var(--primaria); color: #fff; }
    .resumo-topo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .numero { background: var(--cartao); border-radius: 14px; padding: 12px 16px; }
    .numero strong { display: block; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .numero span { font-size: .8rem; color: var(--suave); }
    .numero.alerta strong { color: var(--erro); }
    .filtros { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; font-size: .9rem; flex-wrap: wrap; }
    .filtros select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--borda); background: var(--campo); color: var(--texto); }
    .rolar { overflow-x: auto; background: var(--cartao); border-radius: 14px; }
    table.grelha { border-collapse: collapse; width: 100%; font-size: .85rem; }
    .grelha th, .grelha td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; white-space: nowrap; }
    .grelha th { color: var(--suave); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    .grelha td.num { font-variant-numeric: tabular-nums; }
    .grelha tr.selecionado td { background: var(--realce-fundo); }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 700; background: var(--suave-fundo); color: var(--suave); }
    .chip.jogo { background: var(--realce-fundo); color: var(--certo); }
    .chip.fora { background: var(--perigo-fundo); color: var(--erro); }
    .chip.fim { background: var(--dica-fundo); color: var(--aviso); }
    .chip.ban { background: var(--erro); color: #fff; }
    .chip.ajuda { background: var(--erro); color: #fff; animation: piscar 1s infinite; }
    @keyframes piscar { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .chip.ajuda { animation: none; } }
    .alertas { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .alertas:empty { display: none; }
    .alerta-ajuda { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
      background: var(--perigo-fundo); border: 2px solid var(--erro); border-radius: 14px; padding: 12px 16px; }
    .alerta-ajuda strong { color: var(--erro); font-size: 1.1rem; }
    .alerta-ajuda p { margin: 4px 0 0; }
    .chip.offline { background: transparent; color: var(--erro); border: 1px solid var(--erro); }
    .grelha button { padding: 6px 12px; font-size: .8rem; }
    .gestao { background: var(--cartao); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 2px solid var(--primaria); display: flex; flex-direction: column; gap: 12px; }
    .gestao h2 { margin: 0; font-size: 1.2rem; }
    .gestao .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
    .gestao .acoes button, .gestao .linha-resposta button { font-size: .9rem; padding: 10px 14px; }
    .gestao input { font-size: 1rem; padding: 10px 12px; }
    .gestao .estado-gestao { font-size: .9rem; color: var(--suave); margin: 0; }
    .registo-saidas { list-style: none; padding: 0; margin: 0; font-size: .85rem; display: flex; flex-direction: column; gap: 6px; }
    .registo-saidas li { background: var(--cartao); border-radius: 10px; padding: 8px 12px; }
    .registo-saidas li.penalizada { border-left: 4px solid var(--erro); }
    .vazio { color: var(--suave); padding: 16px; }
    .colunas { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    .colunas h3 { margin: 0 0 8px; font-size: 1rem; }
    .codigos h3 { margin: 20px 0 8px; }
    @media (max-width: 1400px) { .colunas { grid-template-columns: 1fr; } }
    .entrada-dono { max-width: 420px; margin: 15vh auto 0; }
    .acoes-topo { display: flex; gap: 8px; align-items: center; }
    .titulo-evento { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .seletor-evento { font: inherit; font-weight: 700; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--primaria); background: var(--campo); color: var(--primaria-escura); }
    .acoes-topo button { padding: 6px 12px; font-size: .85rem; }
    .carregar { text-align: center; color: var(--suave); margin-top: 20vh; }
  </style>
</head>
<body>
  <div id="raiz"><p class="carregar">A carregar a área do dono…</p></div>
  <noscript>Esta página precisa de JavaScript.</noscript>
  <script>
    // Se algum ficheiro não carregar, mostra o problema em vez de uma página em branco.
    window.addEventListener('error', function (e) {
      var r = document.getElementById('raiz');
      if (r && !r.dataset.pronto) {
        r.innerHTML = '<div class="cartao entrada-dono"><h2>Não foi possível abrir</h2><p>Faltam ficheiros da aplicação. Abre esta página a partir do site do jogo (GitHub Pages), não o ficheiro isolado.</p></div>';
        r.dataset.pronto = '1';
      }
    }, true);
  </script>
  <script src="dados/jogo.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/cripto.js"></script>
  <script src="dados/organizador.js"></script>
  <script src="js/organizador.js"></script>
  <script src="js/dono.js"></script>
  <script>
    if (!window.JOGO || !window.ORGANIZADOR || !window.Organizador) window.dispatchEvent(new Event('error'));
  </script>
</body>
</html>
